[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.public_browser]
  included_files = ["public/**"]

[[edge_functions]]
path = "/*"
function = "root-redirect"

[[edge_functions]]
  path = "/api/chat-stream"
  function = "rag_chatbot"

[[edge_functions]]
  function = "supabase-test"
  path = "/api/supabase-test"

[[redirects]]
  from = "/docs/*"
  to = "/docs/:splat"
  status = 200

[[redirects]]
  from = "/prompts/*"
  to = "/prompts/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/public/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' *.netlify.app *.google.com *.googleusercontent.com *.facebook.com https://cdn.tailwindcss.com fonts.googleapis.com fonts.gstatic.com *.w3.org data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.facebook.com connect.facebook.net; connect-src 'self' *.google.com *.googleusercontent.com *.supabase.co wss://*.supabase.co *.facebook.com"
