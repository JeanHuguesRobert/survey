<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Consultation Citoyenne</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org https://cdnjs.cloudflare.com https://platform-lookaside.fbsbx.com https://*.fbx.com https://*.facebook.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.openai.com https://api.anthropic.com https://api.mistral.ai https://api.edenai.run https://api.search.brave.com https://nominatim.openstreetmap.org https://script.google.com; frame-src 'self' https://www.facebook.com https://connect.facebook.net;"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.svg" />

    <!-- Métadonnées SEO et partage social -->
    <meta
      name="description"
      id="page-description"
      content="Plateforme de consultation citoyenne incluant un wiki collaboratif et un système de propositions citoyennes."
    />
    <meta property="og:title" id="og-title" content="Consultation Citoyenne" />
    <meta
      property="og:description"
      id="og-description"
      content="Participez à la démocratie locale avec notre plateforme de consultation citoyenne."
    />
    <meta property="og:type" content="website" />
    <!-- Explicit og:url and fb:app_id required for Facebook sharing/debugger -->
    <meta property="og:url" id="og-url" content="https://lepp.fr" />
    <meta property="fb:app_id" id="fb-app-id" content="%VITE_FACEBOOK_APP_ID%" />
    <!-- Explicit og:image required by Facebook Debugger; replace with your public image URL -->
    <meta property="og:image" id="og-image" content="https://lepp.fr/images/og-image.png" />
    <meta name="twitter:image" id="twitter-image" content="https://lepp.fr/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Police Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Script pour dynamiser les métadonnées -->
    <script type="module">
      // Récupération des constantes depuis les variables d'environnement
      const CITY_NAME = import.meta.env.VITE_CITY_NAME || "Corte";
      const PARTY_NAME = import.meta.env.VITE_PARTY_NAME || "Petit Parti";
      const SITE_URL =
        import.meta.env.VITE_PUBLIC_URL || import.meta.env.VITE_BASE_URL || "https://lepp.fr";

      // Mise à jour dynamique des métadonnées
      document.getElementById("page-title").textContent = `Consultation Citoyenne - ${PARTY_NAME}`;
      document
        .getElementById("page-description")
        .setAttribute(
          "content",
          `Plateforme de consultation citoyenne pour les élections municipales de ${CITY_NAME}, incluant un wiki collaboratif et un système de propositions citoyennes.`
        );
      document
        .getElementById("og-title")
        .setAttribute("content", `Consultation Citoyenne - ${PARTY_NAME}`);
      document
        .getElementById("og-description")
        .setAttribute(
          "content",
          `Participez à la démocratie locale de ${CITY_NAME} avec notre plateforme de consultation citoyenne.`
        );
      // Ensure an explicit og:image is set (Facebook requires explicit image meta)
      const ogImageUrl = `${SITE_URL.replace(/\/$/, "")}/images/og-image.png`;
      const ogEl = document.getElementById("og-image");
      const twEl = document.getElementById("twitter-image");
      if (ogEl) ogEl.setAttribute("content", ogImageUrl);
      if (twEl) twEl.setAttribute("content", ogImageUrl);

      // Set og:url explicitly for Facebook debugger
      const ogUrlEl = document.getElementById("og-url");
      if (ogUrlEl) ogUrlEl.setAttribute("content", SITE_URL.replace(/\/$/, ""));
    </script>

    <!-- Facebook SDK -->
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "%VITE_FACEBOOK_APP_ID%",
          cookie: true,
          xfbml: true,
          version: "v21.0",
        });

        FB.AppEvents.logPageView();

        // Check login status
        FB.getLoginStatus(function (response) {
          console.log("Facebook login status:", response);
          if (response.status === "connected") {
            console.log("User is logged in to Facebook and your app");
          } else if (response.status === "not_authorized") {
            console.log("User is logged in to Facebook but not your app");
          } else {
            console.log("User is not logged in to Facebook");
          }
        });
      };

      (function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) {
          return;
        }
        js = d.createElement(s);
        js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "facebook-jssdk");
    </script>
  </body>
</html>
